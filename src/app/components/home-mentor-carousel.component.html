<div class="module-carousel-container" (pointerdown)="onPointerDown($event)" (pointerup)="onPointerUp($event)" (pointercancel)="onPointerCancel()">
  <button type="button" class="track-nav track-nav--prev" aria-label="Scroll mentors left" (click)="scrollTrack(-1)">
    <mat-icon aria-hidden="true">chevron_left</mat-icon>
  </button>
  <div #track class="module-track" role="group" aria-label="Meet your mentors">
    @for (card of cards(); track card.heading; let i = $index) {
      <button
        type="button"
        class="module-card"
        [class.is-active]="ringOffset(i) === 0"
        [class.is-prev]="ringOffset(i) === -1"
        [class.is-next]="ringOffset(i) === 1"
        [class.is-hidden]="ringOffset(i) <= -2 || ringOffset(i) >= 2"
        [attr.aria-hidden]="ringOffset(i) <= -2 || ringOffset(i) >= 2 ? true : null"
        [attr.tabindex]="ringOffset(i) <= -2 || ringOffset(i) >= 2 ? -1 : null"
        [attr.aria-pressed]="ringOffset(i) === 0"
        [attr.aria-label]="card.heading"
        (click)="selectCard(i)"
      >
        <span class="module-card__face">
          <span class="mentor-media">
            @if (card.image) {
              <img [src]="card.image" [alt]="card.alt || card.heading" width="720" height="1080" [attr.loading]="i <= 1 ? 'eager' : 'lazy'" [attr.fetchpriority]="i === 0 ? 'high' : 'low'" decoding="async" draggable="false">
            }
          </span>
          <span class="mentor-body">
            <span class="mentor-heading">{{ card.heading }}</span>
            @if (card.text) { <span class="mentor-text">{{ card.text }}</span> }
            @if (card.detail) { <span class="mentor-detail">{{ card.detail }}</span> }
            @if (card.tag) { <span class="mentor-tag">{{ card.tag }}</span> }
          </span>
        </span>
      </button>
    }
  </div>
  <button type="button" class="track-nav track-nav--next" aria-label="Scroll mentors right" (click)="scrollTrack(1)">
    <mat-icon aria-hidden="true">chevron_right</mat-icon>
  </button>
</div>
